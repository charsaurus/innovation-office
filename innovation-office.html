<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Innovation Office</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--navy:#0b2a5b;--blue:#1d6fd1;--red:#e03131;--gold:#f5b301;--green:#2f9e44;--ink:#1d2433;--muted:#6b778c;--line:#d7e3f4;--edge:#9cc3ea}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:linear-gradient(#bfe1ff,#eaf5ff);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);overflow:hidden;font-size:14px}
button{font:inherit;cursor:pointer;border:2px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px;color:var(--ink);font-weight:700}
button:hover{border-color:var(--blue)}
button.primary{background:linear-gradient(#3b8ff0,#1d6fd1);border-color:#1d6fd1;color:#fff}
button.green{background:linear-gradient(#51cf66,#2f9e44);border-color:#2f9e44;color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
input,textarea,select{font:inherit;border:2px solid var(--line);border-radius:10px;padding:6px 8px;width:100%;color:var(--ink);background:#fff}
textarea{resize:vertical;min-height:60px;font-family:Consolas,monospace;font-size:12px}
#app{display:flex;flex-direction:column;height:100vh}
#top{display:flex;gap:8px;align-items:center;padding:8px 12px;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:6px;background:#fff;border:3px solid #fff;box-shadow:0 2px 0 var(--edge),0 3px 8px rgba(0,0,0,.1);border-radius:14px;padding:2px 10px;font-weight:700;white-space:nowrap;min-height:34px}
.pill .ic{font-size:18px}
.mini{width:86px;height:10px;background:#e3ecf7;border-radius:6px;overflow:hidden}
.mini>div{height:100%;border-radius:6px;transition:width .3s}
.lvl{background:radial-gradient(circle at 35% 30%,#ffe066,#f59f00);color:#fff;border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font-size:13px;text-shadow:0 1px 0 rgba(0,0,0,.35);border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.brand{font-weight:800;color:var(--navy);font-size:16px;margin-right:4px}
.brand b{color:var(--red)}
#livePill{cursor:pointer}
#livePill .d{width:10px;height:10px;border-radius:50%;background:#adb5bd}
#livePill.on .d{background:#2f9e44;box-shadow:0 0 0 3px #d3f9d8}
#lunchPill{background:#fff3bf;border-color:#fff3bf}
#stage{position:relative;flex:1;min-height:0;overflow:hidden}
#cv{display:block;cursor:pointer;touch-action:none}
#bottom{display:flex;gap:12px;align-items:stretch;padding:8px 12px 10px;background:linear-gradient(rgba(255,255,255,.75),#fff);border-top:3px solid #fff;box-shadow:0 -2px 10px rgba(0,0,0,.06)}
#tools{display:grid;grid-template-columns:repeat(5,54px);gap:6px;align-content:center}
.tool{width:54px;height:50px;border-radius:14px;border:3px solid #fff;background:linear-gradient(#fff,#e2eefc);box-shadow:0 2px 0 var(--edge);font-size:21px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:0;line-height:1}
.tool small{font-size:9px;font-weight:800;color:var(--navy);margin-top:2px}
.tool.on{background:linear-gradient(#fff3bf,#ffd43b)}
.badge{position:absolute;top:-7px;right:-7px;background:var(--red);color:#fff;border-radius:999px;font-size:11px;min-width:19px;height:19px;display:grid;place-items:center;padding:0 4px;border:2px solid #fff}
#friendsWrap{flex:1;min-width:0;display:flex;flex-direction:column}
#friendsWrap .ttl{font-size:11px;font-weight:800;color:var(--navy);margin:0 0 3px 2px;text-transform:uppercase;letter-spacing:.5px}
#friends{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 6px}
.friend{flex:0 0 88px;background:linear-gradient(#e8f7ff,#c5e6ff);border:3px solid #fff;border-radius:14px;box-shadow:0 2px 0 var(--edge);text-align:center;cursor:pointer;position:relative;padding:3px 2px 4px}
.friend:hover{transform:translateY(-2px)}
.friend canvas{width:60px;height:60px;display:block;margin:0 auto}
.friend .nm{font-weight:800;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 3px}
.friend .rk{font-size:10px;color:var(--muted)}
.friend .dot{position:absolute;top:5px;left:5px;width:11px;height:11px;border-radius:50%;background:#2f9e44;border:2px solid #fff}
.friend.me{background:linear-gradient(#fff9db,#ffe066)}
.friend.off{filter:grayscale(.7);opacity:.75}
#panel{position:absolute;top:8px;right:8px;bottom:8px;width:350px;background:#fff;border-radius:18px;border:4px solid #fff;box-shadow:0 8px 30px rgba(0,0,0,.22);display:none;flex-direction:column;overflow:hidden;z-index:5}
#panel.show{display:flex}
#panel header{background:linear-gradient(#3b8ff0,#1d5fb8);color:#fff;padding:10px 14px;font-weight:800;font-size:16px;display:flex;align-items:center}
#panel header button{margin-left:auto;background:rgba(255,255,255,.22);border:0;color:#fff;border-radius:8px;width:30px;height:30px;padding:0}
#pbody{padding:12px 14px;overflow:auto;flex:1}
h3{margin:6px 0 8px;font-size:14px;color:var(--navy)}
.muted{color:var(--muted);font-size:12px}
.task{border:2px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:8px;display:flex;gap:8px;align-items:center}
.task .t{flex:1}
.task .r{font-size:12px;color:var(--muted)}
.choices{display:flex;flex-direction:column;gap:6px;margin-top:12px}.choices button{text-align:left;padding:9px 12px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}.chip{padding:4px 9px;border-radius:999px;font-size:12px}.chip.sel{border-color:var(--red);background:#fff0f0}.ub{background:#e03131;color:#fff;border-radius:999px;padding:0 5px;font-size:10px}
.thread{height:240px;overflow:auto;background:#f8fafc;border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:5px;margin-bottom:8px}
.dm{max-width:78%;align-self:flex-start;background:#fff;border:1px solid var(--line);border-radius:12px 12px 12px 3px;padding:5px 9px;font-size:13px;word-wrap:break-word}.dm.me{align-self:flex-end;background:#1d6fd1;color:#fff;border-color:#1d6fd1;border-radius:12px 12px 3px 12px}
.prow{display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:6px 0}.prow .t{flex:1;min-width:0}.pb{display:flex;gap:3px}.pb button{padding:4px 7px}
pre.code{background:#0b2a5b;color:#d0e2ff;border-radius:8px;padding:8px;font-size:11px;white-space:pre-wrap;word-break:break-all;margin:6px 0}
.box{background:#f1f7ff;border-radius:12px;padding:10px;margin:8px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tools3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px}.tools3 button{padding:8px 4px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.item{display:flex;flex-direction:column;align-items:center;padding:6px 3px;font-size:11px;gap:1px;line-height:1.2}
.item .e{font-size:24px;line-height:1.15}
.item.sel{border-color:var(--red);box-shadow:0 0 0 2px rgba(224,49,49,.2)}
.sw{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}
.sw button{width:26px;height:26px;padding:0;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.sw button.sel{box-shadow:0 0 0 3px var(--red)}
.row{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.row>*{flex:1}
.gift{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:12px;padding:6px 8px;margin-bottom:6px}
.gift .e{font-size:26px}
.gift .t{flex:1;font-size:13px}
.meter{height:8px;background:#e9ecef;border-radius:5px;overflow:hidden;margin-top:3px}
.meter>div{height:100%;background:linear-gradient(90deg,#51cf66,#94d82d);border-radius:5px}
code{background:#f1f3f5;border-radius:6px;padding:1px 5px;font-size:12px}
#alertBar{position:absolute;top:56px;left:50%;transform:translateX(-50%);background:#c92a2a;color:#fff;border-radius:14px;padding:8px 14px;display:none;align-items:center;gap:8px;z-index:6;font-size:14px;box-shadow:0 4px 16px rgba(201,42,42,.5);white-space:nowrap}
#alertBar button{padding:4px 10px}
#alarm{position:absolute;inset:0;pointer-events:none;display:none;z-index:4;animation:alarm 1s ease-in-out infinite}
@keyframes alarm{0%,100%{box-shadow:inset 0 0 40px 10px rgba(224,49,49,.15)}50%{box-shadow:inset 0 0 90px 30px rgba(224,49,49,.55)}}
#banner{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.97);border:3px solid #fff;border-radius:999px;padding:5px 6px 5px 14px;box-shadow:0 3px 12px rgba(0,0,0,.15);display:none;align-items:center;gap:8px;white-space:nowrap;font-size:13px;z-index:4}
#banner button{border-radius:999px;padding:3px 10px}
#toasts{position:absolute;top:8px;left:8px;display:flex;flex-direction:column;gap:6px;pointer-events:none;z-index:6}
.toast{background:rgba(11,42,91,.92);color:#fff;padding:8px 12px;border-radius:12px;font-size:13px;box-shadow:0 3px 10px rgba(0,0,0,.2);max-width:320px;animation:tin .25s ease}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}to{opacity:1}}
#chatbar{position:absolute;left:8px;bottom:8px;display:flex;gap:6px;z-index:4}
#chatbar input{width:260px;border-radius:999px;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.15);padding:6px 14px}
#camctl{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px;z-index:4}
#camctl button{width:40px;height:40px;border-radius:12px;border:3px solid #fff;box-shadow:0 2px 0 var(--edge);font-size:18px;padding:0;background:linear-gradient(#fff,#e2eefc)}
#pop{position:fixed;background:#fff;border-radius:14px;border:3px solid #fff;box-shadow:0 6px 20px rgba(0,0,0,.25);padding:6px;display:none;flex-direction:column;gap:4px;z-index:20;min-width:150px}
#pop .ttl{font-weight:800;padding:2px 6px 4px;color:var(--navy)}
#pop button{text-align:left}
.modal{position:fixed;inset:0;background:rgba(10,20,40,.55);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}
.modal.show{display:flex}
.card{background:#fff;border-radius:18px;padding:20px;width:min(460px,100%);box-shadow:0 10px 40px rgba(0,0,0,.3);border:4px solid #fff}
.card h2{margin:0 0 6px;color:var(--navy)}
.choices{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.choices button{text-align:left;padding:10px 12px}
.opt{font-size:12px;padding:4px 9px;margin:0 4px 5px 0;border-radius:999px}
.opt.sel{border-color:var(--red);box-shadow:0 0 0 2px rgba(224,49,49,.2)}
.opt .lk{color:var(--muted);font-weight:400}
kbd{background:#eef2f8;border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:12px}
@media (max-width:900px){#tools{grid-template-columns:repeat(5,46px)}.tool{width:46px;height:44px;font-size:18px}#panel{width:auto;left:8px}#chatbar input{width:170px}}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="brand"><span id="brandCo"></span><b>Innovation</b> Office</div>
    <div class="pill"><span class="ic">🪙</span><span id="coins">0</span></div>
    <div class="pill" title="Energy"><span class="ic">⚡</span><div class="mini"><div id="enfill" style="background:#51cf66"></div></div></div>
    <div class="pill" title="Experience"><div class="lvl" id="lvl">1</div><div><div id="prank" style="font-size:12px">Intern</div><div class="mini"><div id="xpfill" style="background:var(--gold)"></div></div></div></div>
    <div class="pill" title="Cubicle comfort"><span class="ic">👍</span><span id="comfort">0</span></div>
    <div class="pill" id="boostPill" style="display:none" title="XP boost"><span class="ic">🔥</span><span id="boostTxt"></span></div>
    <div class="pill" id="goalPill" title="Your goal: get promoted all the way to CEO"><span class="ic">🎯</span><span id="goalTxt">Goal: CEO</span></div>
    <div class="pill" id="lunchPill" style="display:none" title="Lunch is served in the Pantry"><span class="ic">🍱</span>Lunch break</div>
    <div class="pill" style="margin-left:auto"><span class="ic">🕒</span><span id="clock">09:00</span></div>
    <div class="pill" id="livePill" title="Live office"><span class="d"></span><span id="liveTxt">Offline</span></div>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="banner"></div>
    <div id="alertBar"></div><div id="alarm"></div>
    <div id="toasts"></div>
    <div id="chatbar"><input id="chatIn" maxlength="80" placeholder="💬 Say something… (Enter)"></div>
    <div id="camctl"><button id="zIn" title="Zoom in">＋</button><button id="zOut" title="Zoom out">－</button><button id="zMe" title="Back to me">🎯</button></div>
    <div id="panel"><header><span id="ptitle"></span><button id="pclose" title="Close">✕</button></header><div id="pbody"></div></div>
  </div>
  <div id="bottom">
    <div id="tools">
      <button class="tool" data-p="tasks">📋<small>Tasks</small><span class="badge" id="bTasks" style="display:none"></span></button>
      <button class="tool" data-p="deco">🔨<small>Build</small></button>
      <button class="tool" data-p="gifts">🎁<small>Gifts</small><span class="badge" id="bGifts" style="display:none"></span></button>
      <button class="tool" data-p="meet">📣<small>Meetings</small><span class="badge" id="bMeet" style="display:none">!</span></button>
      <button class="tool" data-p="live">🌐<small>Live</small></button>
      <button class="tool" data-p="share">🔗<small>Share</small></button>
      <button class="tool" data-p="team">⚙️<small>Settings</small></button>
      <button class="tool" data-p="help">❔<small>Help</small></button>
      <button class="tool" data-p="dms">💬<small>Chats</small><span class="badge" id="bDms" style="display:none"></span></button>
      <button class="tool" data-p="people">💕<small>People</small></button>
    </div>
    <div id="friendsWrap"><div class="ttl">Colleagues</div><div id="friends"></div></div>
  </div>
</div>
<div id="pop"></div>

<div class="modal" id="setupModal"><div class="card" style="width:min(680px,100%)">
  <h2 id="setTitle">Welcome to the office! 👋</h2>
  <div class="muted" id="setSub">Create your avatar. You can change it any time from 👗 Wardrobe in ⚙️ Settings.</div>
  <div style="display:flex;gap:16px;margin-top:10px;flex-wrap:wrap">
    <div style="text-align:center">
      <canvas id="setPrev" width="300" height="360" style="width:150px;height:180px;background:linear-gradient(#eaf5ff,#cfe6ff);border-radius:16px"></canvas>
      <div><button id="setTurn" style="margin-top:6px">↻ Turn</button></div>
      <div class="muted" style="margin-top:6px">You have 🪙 <b id="setCoins"></b></div>
    </div>
    <div id="setOpts" style="flex:1;min-width:260px;max-height:56vh;overflow:auto;padding-right:4px"></div>
  </div>
  <div id="setBuy" class="box" style="display:none"></div>
  <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:10px"><button id="setCancel">Cancel</button><button class="primary" id="setGo">Start working →</button></div>
</div></div>
<div class="modal" id="meetModal"><div class="card" id="meetCard"></div></div>
<div class="modal" id="choiceModal"><div class="card" id="choiceCard"></div></div>

<script>
"use strict";
// ======================= CONFIG =======================
// Grid: x runs down-right, y runs down-left on screen. Columns 60-65 are the bar annex.
const W=72,H=46,MAIN_W=60,BAR_X2=64,TW=40,TH=20;
const OX=H*TW/2+40,OY=130,WW=(W+H)*TW/2+80,WH=(W+H)*TH/2+OY+60; // world (iso) size in px
const EMOJI_FONT='"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
const UI_FONT='"Trebuchet MS","Segoe UI",system-ui,sans-serif';
const GAME_VERSION='1.3.0';
// ======================= CONFIG: real names live in config.yaml (gitignored) =======================
// Where the names come from, first match wins:
//   1. the live server that served this page (it reads config.yaml next to the game)
//   2. the desktop app (config.yaml next to InnovationOffice.exe)
//   3. a config.yaml imported in ⚙️ Settings, or names received from a live host
// Without any of these the office uses the generic names below.
const CONFIG_KEY='innovationOffice.config';
const CONFIG_DEFAULTS={company:'',tee:'IO',boss:{name:'Morgan'},dj:{name:'Kai'},
  rooms:{huddle:'Huddle',focus:'Focus',studio:'Studio',summit:'Summit',lab:'Lab',auditorium:'Auditorium'},colleagues:[]};
function parseYAML(text){ // small YAML subset: nested maps, lists, lists of maps, quoted strings, # comments
  const lines=String(text||'').replace(/\r/g,'').split('\n').map(l=>l.replace(/(^|\s)#.*$/,'')).filter(l=>l.trim());
  let i=0;const ind=l=>l.match(/^ */)[0].length,isItem=l=>/^\s*-(\s|$)/.test(l);
  const scalar=v=>{v=v.trim();if(/^"(.*)"$/.test(v)||/^'(.*)'$/.test(v))return v.slice(1,-1);if(v==='true'||v==='false')return v==='true';if(/^-?\d+(\.\d+)?$/.test(v))return +v;return v;};
  function block(lv){return i<lines.length&&isItem(lines[i])?list(lv):map(lv);}
  function list(lv){const a=[];
    while(i<lines.length&&ind(lines[i])===lv&&isItem(lines[i])){
      const rest=lines[i].trim().slice(1).trim();
      if(!rest){i++;a.push(i<lines.length&&ind(lines[i])>lv?block(ind(lines[i])):null);}
      else if(/^[\w-]+:(\s|$)/.test(rest)){const lv2=lv+lines[i].trim().indexOf(rest)+(ind(lines[i])-lv);lines[i]=' '.repeat(lv2)+rest;a.push(map(lv2));}
      else{a.push(scalar(rest));i++;}
    }return a;}
  function map(lv){const o={};
    while(i<lines.length&&ind(lines[i])===lv&&!isItem(lines[i])){
      const m=lines[i].trim().match(/^([\w-]+):(?:\s+(.*))?$/);i++;if(!m)continue;
      if(m[2]!=null&&m[2].trim()!=='')o[m[1]]=scalar(m[2]);
      else if(i<lines.length&&(ind(lines[i])>lv||(ind(lines[i])===lv&&isItem(lines[i]))))o[m[1]]=block(ind(lines[i]));
      else o[m[1]]=null;
    }return o;}
  return lines.length?block(ind(lines[0])):{};
}
function cleanConfig(raw){ // names only: short text, no HTML characters
  const t=(v,n)=>typeof v==='string'||typeof v==='number'?String(v).replace(/[\u0000-\u001f<>&"`]/g,'').trim().slice(0,n||24):'';
  const r=raw&&typeof raw==='object'?raw:{},d=CONFIG_DEFAULTS,o={company:t(r.company,20)||d.company,tee:t(r.tee,3)||d.tee,
    boss:{name:t(r.boss&&r.boss.name,16)||d.boss.name},dj:{name:t(r.dj&&r.dj.name,16)||d.dj.name},rooms:{},colleagues:[]};
  for(const k in d.rooms)o.rooms[k]=t(r.rooms&&r.rooms[k],16)||d.rooms[k];
  (Array.isArray(r.colleagues)?r.colleagues:[]).slice(0,6).forEach(c=>{c=c&&typeof c==='object'?c:{name:c};
    o.colleagues.push({name:t(c.name,16),role:t(c.role,24),body:c.body==='girl'||c.body==='boy'?c.body:''});});
  return o;
}
const CFG=(()=>{
  try{if(window.OFFICE_CONFIG)return cleanConfig(window.OFFICE_CONFIG);}catch(e){}
  try{if(window.officeHost&&window.officeHost.config)return cleanConfig(window.officeHost.config);}catch(e){}
  try{const s=localStorage.getItem(CONFIG_KEY);if(s)return cleanConfig(JSON.parse(s));}catch(e){}
  return cleanConfig({});
})();
const BOSS=CFG.boss.name,DJ=CFG.dj.name,RN=CFG.rooms;
const CFG_SRC=window.OFFICE_CONFIG?'the live server':window.officeHost&&window.officeHost.config?'config.yaml next to the app':localStorage.getItem(CONFIG_KEY)?'an imported config':'';

const RANKS=[{n:'Intern',xp:0},{n:'Analyst',xp:100},{n:'Associate',xp:300},{n:'Manager',xp:700},{n:'Director',xp:1300},{n:'CEO',xp:2200}];
const ITEMS={
  rug:{e:'🟥',n:'Rug',c:20,s:1,r:0,walk:true},
  cactus:{e:'🌵',n:'Desk cactus',c:15,s:1,r:0},
  plant:{e:'🪴',n:'Potted plant',c:25,s:2,r:0},
  books:{e:'📚',n:'Book stack',c:30,s:2,r:0},
  bear:{e:'🧸',n:'Teddy bear',c:35,s:3,r:0},
  lamp:{e:'💡',n:'Lamp',c:45,s:3,r:1},
  art:{e:'🖼️',n:'Wall art',c:60,s:4,r:1},
  guitar:{e:'🎸',n:'Guitar',c:90,s:5,r:2},
  trophy:{e:'🏆',n:'Hackathon trophy',c:120,s:7,r:2},
  fish:{e:'🐠',n:'Fish tank',c:160,s:8,r:3},
  espresso:{e:'☕',n:'Espresso machine',c:200,s:10,r:3},
  game:{e:'🎮',n:'Game console',c:260,s:12,r:4},
  sofa:{e:'🛋️',n:'Mini sofa',c:350,s:15,r:4},
  crown:{e:'👑',n:'CEO crown',c:600,s:25,r:5},
};
// Gifts. Food & drink land on the recipient's desk and are eaten 25% at a time.

function canWalk(x,y,who){

  if(x>=MAIN_W-1&&!barShown())return false;
  if(CORNER_DOOR.some(d=>d.x===x&&d.y===y)&&(who==='npc'||(who==='player'&&rankIdx()<4)))return false;
  return true;
}
function findPath(sx,sy,tx,ty,who){
  if(!canWalk(tx,ty,who))return null;
  if(sx===tx&&sy===ty)return [];
  if(sx<0||sy<0||sx>=W||sy>=H)return null;
  const prev=new Int32Array(W*H).fill(-1),s=sy*W+sx,t=ty*W+tx;prev[s]=s;
  const q=[s];let qi=0;
  while(qi<q.length){
    const cur=q[qi++];if(cur===t)break;
    const cx=cur%W,cy=(cur/W)|0;
    for(const [ddx,ddy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=cx+ddx,ny=cy+ddy;if(!canWalk(nx,ny,who))continue;
      const n=ny*W+nx;if(prev[n]!==-1)continue;prev[n]=cur;q.push(n);
    }

  if(prev[t]===-1)return null;
  const path=[];let c=t;while(c!==s){path.push({x:c%W,y:(c/W)|0});c=prev[c];}

}

function cubeOK(cube,c){ // can you still walk from the opening to the chair?

  for(const f of FURN)if(f.cube===c.i)for(let x=f.x;x<f.x+f.w;x++)b[key(x,f.y)]=1;
  cube.items.forEach(it=>{if(ITEMS[it.t]&&!ITEMS[it.t].walk){const a=abs(c,it.dx,it.dy);b[key(a.x,a.y)]=1;}});

function roomAt(x,y){for(const k in ROOMS){const r=ROOMS[k];if(x>=r.x1&&x<=r.x2&&y>=r.y1&&y<=r.y2)return r;}return null;}

// ----- meetings -----
function playerSeat(room){const s=ROOMS[room].seats;return s[s.length-1];}
function startMeeting(){
  meeting.phase='live';meeting.t=meeting.hosted?28:22;meeting.joined=false;
  const seats=ROOMS[meeting.room].seats;let k=0;
  npcs.forEach((n,i)=>{if(npcHidden(i))return;n.meeting=true;n.lunching=false;const s=seats[k++%Math.max(1,seats.length-1)];goTo(n,s.x,s.y,'npc');});
  const lead=npcs.find((n,i)=>!npcHidden(i));if(lead)say(lead,meeting.hosted?'Meeting time, everyone!':'Stand-up time!');
  renderPanel();updateBadges();
}
function endMeeting(){
  meeting.phase='idle';meeting.t=rnd(110,160);
  npcs.forEach(n=>{if(!n.meeting)return;n.meeting=false;goTo(n,n.home.x,n.home.y,'npc');n.timer=rnd(5,12);});
  renderPanel();updateBadges();
}
function joinMeeting(){const s=playerSeat(meeting.room);work=null;if(!walkPlayer(s.x,s.y))toast('Can\'t reach the room.');}
function hostMeeting(room){
  if(rankIdx()<3){toast('🔒 Hosting unlocks at Manager.');return;}
  if(meeting.phase!=='idle'){toast('A meeting is already on.');return;}
  if(hostCd>0){toast('Give the team a break — '+Math.ceil(hostCd)+'s');return;}
  if(state.player.energy<20){toast('😴 Need 20⚡ to host.');return;}
  state.player.energy-=20;hostCd=90;meeting.room=room;meeting.hosted=true;startMeeting();joinMeeting();updateHUD();
  liveSend({t:'say',text:'📣 Meeting in '+ROOMS[room].name+' — come join!'});
}
function openMeetModal(){

// ----- decorating -----
// Tools: an item key places it; 'move' picks an item up and drops it on a free tile; 'rotate' turns an item; 'remove' sells it back.
function itemAtTile(cd,p){return cd.items.findIndex(it=>it.dx===p.dx&&it.dy===p.dy);}
function placeItem(x,y){
  if(mySeat<0)return;
  const c=CUBES[mySeat];if(!isPlaceable(c,x,y))return;
  const cd=state.myCube,p=canon(c,x,y);
  const existing=itemAtTile(cd,p);
  const standing=Math.round(player.x)===x&&Math.round(player.y)===y;
  if(deco.sel==='remove'){
    if(existing<0)return;
    const it=cd.items[existing];cd.items.splice(existing,1);
    state.player.coins+=Math.floor(ITEMS[it.t].c*0.5);afterCubeChange();return;
  }
  if(deco.sel==='rotate'){
    if(existing<0){toast('Click an item in your cubicle to rotate it.');return;}
    const it=cd.items[existing];it.r=((it.r||0)+1)%2;afterCubeChange();return;
  }
  if(deco.sel==='move'){
    if(deco.held==null){ // pick up
      if(existing<0){toast('Click an item to pick it up.');return;}
      deco.held=existing;renderPanel();return;
    }
    const it=cd.items[deco.held];if(!it){deco.held=null;renderPanel();return;}
    if(existing===deco.held){deco.held=null;renderPanel();return;} // dropped back where it was
    if(existing>=0){toast('That spot is taken — pick another green tile.');return;}
    if(!ITEMS[it.t].walk&&standing){toast('You\'re standing there — step aside first.');return;}
    const ox=it.dx,oy=it.dy;it.dx=p.dx;it.dy=p.dy;
    if(!cubeOK(cd,c)){it.dx=ox;it.dy=oy;toast('That would block the way to your chair!');return;}
    deco.held=null;afterCubeChange();return;
  }
  if(existing>=0){toast('That spot is taken. Use ✋ Move or 🗑️ Remove first.');return;}
  const def=ITEMS[deco.sel],owned=state.inventory[deco.sel]||0;
  if(!owned&&def.r>rankIdx()){toast('🔒 Unlocks at '+RANKS[def.r].n);return;}
  if(!owned&&state.player.coins<def.c){toast('Not enough 🪙 — finish more tasks!');return;}
  if(!def.walk&&standing){toast('You\'re standing there — step aside first.');return;}
  const it={t:deco.sel,dx:p.dx,dy:p.dy,r:deco.rot||0};if(def.walk)it.col=pick(RUGS);
  cd.items.push(it);
  if(!cubeOK(cd,c)){cd.items.pop();toast('That would block the way to your chair!');return;}
  if(owned)state.inventory[deco.sel]--;else state.player.coins-=def.c;
  afterCubeChange();
}
function rotateTool(){ // R key: turn the item you're holding, or the next item you'll place
  if(curPanel!=='deco'||mySeat<0)return;
  if(deco.sel==='move'&&deco.held!=null){const it=state.myCube.items[deco.held];if(it){it.r=((it.r||0)+1)%2;afterCubeChange();}return;}
  if(ITEMS[deco.sel]){deco.rot=((deco.rot||0)+1)%2;renderPanel();}
}
function afterCubeChange(){rebuildBlocked();updateHUD();updateBanner();renderPanel();sendProfile();save();}

// ----- gifts -----
function friendTargets(){
  const list=[];
  for(const [id,f] of Object.entries(state.friends))list.push({key:id,name:f.name,kind:'remote',online:live.players.has(id)});
  list.sort((a,b)=>(b.online-a.online)||a.name.localeCompare(b.name));
  state.team.forEach((t,i)=>list.push({key:'n'+i,name:t.name+' · computer',kind:'npc',n:i}));
  return list;
}
function sendGift(key,g){
  const def=GIFTS[g],tgt=friendTargets().find(f=>f.key===key);if(!def||!tgt)return;
  if(tgt.kind==='remote'&&!live.on){toast('Connect to the 🌐 Live office to gift real colleagues.');return;}
  if(def.free){if(state.daily.free.includes(key)){toast('You already sent '+tgt.name+' a free kopi today.');return;}state.daily.free.push(key);}
  else{if(state.player.coins<def.c){toast('Not enough 🪙');return;}state.player.coins-=def.c;}
  if(tgt.kind==='npc'){
    const n=npcs[tgt.n];if(n&&!npcHidden(tgt.n))say(n,'Thanks for the '+def.n.toLowerCase()+'! '+def.e,4);
    const rl=relOf(key);rl.aff=Math.min(100,rl.aff+(g==='cake'||g==='plantgift'?5:3));
    if(Math.random()<0.4)setTimeout(()=>npcGift(tgt.n),rnd(20000,60000));
  }else{
    liveSend({t:'gift',to:key,g});
    if(!tgt.online)toast('📬 '+tgt.name+' is away — it\'ll be on their desk when they\'re back.');
  }
  addXP(3);toast(def.e+' Sent '+def.n+' to '+tgt.name.replace(' · computer','')+'!');floatText(player,def.e+' sent!','#e64980');
  updateHUD();renderPanel();save();
}
function npcGift(n){
  if(n==null)n=ri(0,5);
  const g=pick(['kopi','tehtarik','kaya','curry','milo','kudos','bubbletea','beer','wine','cocktail']);
  receiveGift({from:state.team[n].name,g,at:Date.now()});
}
function receiveGift(gift){
  if(!GIFTS[gift.g])return;
  if(!barShown()&&GIFTS[gift.g].cat==='bar')gift=Object.assign({},gift,{g:'mocktail'}); // bar hidden: alcohol arrives as a mocktail
  const from=String(gift.from||'Someone').slice(0,16),def=GIFTS[gift.g];
  if(isFood(gift.g)){
    state.deskGifts.push({id:Math.random().toString(36).slice(2,8),g:gift.g,from,left:4});
    state.deskGifts=state.deskGifts.slice(-12);
    toast('🎁 '+from+' sent you '+def.n+' '+def.e+' — it\'s on your desk!');sendProfile();
  }else{
    state.inbox.push({from,g:gift.g,at:gift.at||Date.now()});state.inbox=state.inbox.slice(-40);
    toast('🎁 '+from+' sent you '+def.n+' '+def.e);
  }
  updateBadges();renderPanel();save();
}
function applyEffect(def,frac,label){
  frac=frac||1;const e=def.eff,parts=[];
  if(e.en){const v=Math.round(e.en*frac);state.player.energy=Math.min(100,state.player.energy+v);parts.push('+'+v+'⚡');}
  if(e.boost){const v=Math.round(e.boost*frac);state.boostT+=v;parts.push('🔥'+v+'s');}
  if(e.xp){parts.push('+'+addXP(Math.max(1,Math.round(e.xp*frac)))+'⭐');}
  if(e.item){state.inventory[e.item]=(state.inventory[e.item]||0)+1;parts.push(ITEMS[e.item].e+' added to Build');}
  floatText(player,(label||def.e)+' '+parts.join(' '),'#e64980');
}
function openGift(i){
  const it=state.inbox[i];if(!it)return;
  applyEffect(GIFTS[it.g]);
  state.inbox.splice(i,1);state.giftsReceived++;
  sendProfile();updateHUD();updateBadges();renderPanel();save();
}
// Eat or drink a desk gift 25% at a time (100% → 75% → 50% → 25% → gone).
function biteDeskGift(id){
  const i=state.deskGifts.findIndex(d=>d.id===id);if(i<0)return;
  const d=state.deskGifts[i],def=GIFTS[d.g];
  d.left--;applyEffect(def,.25,def.e+' '+(d.left*25)+'% left');
  if(d.left<=0){state.deskGifts.splice(i,1);state.giftsReceived++;say(player,pick(['Yum! Thanks '+d.from+' 😋','That hit the spot!','Delicious 😋']));}
  sendProfile();updateHUD();updateBadges();renderPanel();save();
}
function consumeFromDesk(id){
  if(mySeat<0){biteDeskGift(id);return;}
  const h=CUBES[mySeat].chair;
  if(Math.hypot(player.x-h.x,player.y-h.y)<1.6&&!player.path.length){biteDeskGift(id);return;}
  pendingTarget=h;walkPlayer(h.x,h.y,()=>biteDeskGift(id));
}
// Where each desk gift sits (world px), for drawing and clicking.
function deskGiftSpots(seat,dg){

  (dg||[]).slice(0,3).forEach((d,k)=>{const p=ptAbs(c,[1.35,2.15,4.65][k],1.68),s=iso(p.x,p.y);out.push({d,x:s.x,y:s.y-17});}); // kept clear of the chair so you can still see them while seated

function barPeople(){return people().filter(p=>!p.me&&p.kind!=='bartender'&&p.kind!=='dj'&&(inBar(p.e)||inClub(p.e)));}
function openBar(){

function buyDrink(g,who){
  const def=GIFTS[g];if(!def||!barShown())return;
  if(who==='round'){
    const ppl=barPeople(),n=ppl.length+1,cost=def.c*n;
    if(state.player.coins<cost){toast('A round for '+n+' costs '+cost+'🪙 — not enough coins.');return;}
    state.player.coins-=cost;applyEffect(def);
    ppl.forEach(p=>{if(p.kind==='npc')say(p.e,'Cheers, '+state.player.name+'! '+def.e,4);if(p.kind==='remote')liveSend({t:'gift',to:p.id,g});});
    const msg='🍻 A round of '+def.n.toLowerCase()+' for everyone at the bar!';
    say(player,msg,5);liveSend({t:'say',text:msg});say(bartender,'Coming right up! '+def.e);
    addXP(4*ppl.length);toast('🍻 You bought a round for '+n+' ('+cost+'🪙)');
  }else if(who==='me'){
    if(state.player.coins<def.c){toast('Not enough 🪙');return;}
    state.player.coins-=def.c;applyEffect(def);say(bartender,'Here you go! '+def.e);say(player,'Cheers! '+def.e);
  }else{
    const tgt=friendTargets().find(f=>f.key===who);if(!tgt)return;
    sendGift(who,g);
    const here=barPeople().find(p=>(p.kind==='npc'&&'n'+p.n===who)||(p.kind==='remote'&&p.id===who));
    if(here){const msg=def.e+' This one\'s for '+tgt.name.replace(' · computer','')+'!';say(player,msg,4);liveSend({t:'say',text:msg});}
  }
  updateHUD();renderPanel();save();
}

// ======================= LIVE MODE =======================
// players: colleagues online now. known: every colleague this office has seen (online or away), with their desk.
const live={ws:null,on:false,players:new Map(),known:new Map(),url:'',want:false,retryT:null,connecting:false,admin:false};
function liveSend(o){if(live.on&&live.ws&&live.ws.readyState===1)live.ws.send(JSON.stringify(o));}
function myProfile(){const p=state.player;return {name:p.name,shirt:p.look.topCol,hair:p.look.hairCol,look:p.look,xp:p.xp,gifts:state.giftsReceived,cube:state.myCube,dg:state.deskGifts.slice(0,4).map(d=>({g:d.g,l:d.left})),partner:state.partner&&!isNpcKey(state.partner.key)?state.partner.key:''};}
let profT=null;
function sendProfile(){clearTimeout(profT);profT=setTimeout(()=>liveSend({t:'profile',p:myProfile()}),300);}
function normAddr(a){a=String(a||'').trim().replace(/^(https?|wss?):\/\//,'').replace(/\/.*$/,'');if(!a)return '';if(!/:\d+$/.test(a))a+=':8787';return a;}
function liveConnect(addr,quiet){
  addr=normAddr(addr);if(!addr){toast('Enter the host\'s address, e.g. 10.0.0.5:8787');return;}
  liveDisconnect(true);
  live.want=true;live.url='ws://'+addr+'/ws';live.connecting=true;state.server=addr;state.autoJoin=true;save();updateLivePill();renderPanel();
  let ws;try{ws=new WebSocket(live.url);}catch(e){live.connecting=false;if(!quiet)toast('Could not connect to '+addr);renderPanel();return;}
  live.ws=ws;
  const failT=setTimeout(()=>{if(ws.readyState!==1){try{ws.close();}catch(e){}}},6000);
  ws.onopen=()=>{clearTimeout(failT);ws.send(JSON.stringify({t:'hello',id:state.id,p:myProfile()}));};
  ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data);}catch(e){return;}onLive(m);};
  ws.onclose=()=>{
    clearTimeout(failT);const was=live.on;live.connecting=false;
    if(live.ws!==ws)return;
    goOffline();
    if(was)toast('🔌 Lost the live office. Reconnecting in the background…');
    else if(!quiet)toast('Could not reach '+addr+'. I\'ll keep trying — is the host running and on the same network?');
    if(live.want){clearTimeout(live.retryT);live.retryT=setTimeout(()=>{if(live.want&&!live.on)liveConnect(addr,true);},was?5000:15000);}
    updateLivePill();renderPanel();
  };
}
function liveDisconnect(silent,user){
  live.want=false;clearTimeout(live.retryT);
  if(user){state.autoJoin=false;state.hosting=false;save();}
  if(live.ws){const w=live.ws;live.ws=null;try{w.close();}catch(e){}}
  if(live.on)goOffline();
  if(!silent)toast('Disconnected. You\'re in your offline office.');
  updateLivePill();renderPanel();
}
function goOffline(){
  live.on=false;live.players.clear();live.known.clear();live.ws=null;
  const oldSeat=mySeat;mySeat=0;
  if(oldSeat!==0){const h=homeSpot();player.x=h.x;player.y=h.y;player.path=[];}
  rebuildBlocked();updateLivePill();renderFriends();renderPanel();curCube=-2;
}
function setKnown(id,p,seat){
  const prof=Object.assign({},p,{cube:cleanCube(p&&p.cube),dg:cleanDG(p&&p.dg)});
  prof.name=String(prof.name||'Colleague').slice(0,16);
  prof.look=lookOf(p);prof.shirt=prof.look.topCol;prof.hair=prof.look.hairCol;
  if(typeof seat!=='number'||seat>=CUBES.length)seat=-1;
  if(seat>=0)for(const k of live.known.values())if(k.id!==id&&k.seat===seat)k.seat=-1;
  const k=live.known.get(id)||{id};k.p=prof;k.seat=seat;live.known.set(id,k);
  state.friends[id]={name:prof.name,shirt:prof.shirt,hair:prof.hair,look:prof.look,xp:prof.xp||0};
  return k;
}
function addRemote(pl){
  const k=setKnown(pl.id,pl.p,pl.seat);
  const old=live.players.get(pl.id);
  const e=old?old.e:mkEnt(pl.x,pl.y);e.speed=4.2;
  live.players.set(pl.id,{id:pl.id,seat:k.seat,p:k.p,e});
}
function onLive(m){
  if(m.t==='welcome'){
    live.on=true;live.connecting=false;live.admin=!!m.admin;live.apiKey=typeof m.apiKey==='string'?m.apiKey:'';live.serverEmer=Array.isArray(m.features)&&m.features.includes('emergency');
    if(live.serverEmer&&m.emergency)startEmergency(m.emergency.id,m.emergency.secs);
    if(m.config&&!window.OFFICE_CONFIG&&!(window.officeHost&&window.officeHost.config)){const c=JSON.stringify(cleanConfig(m.config));
      if(localStorage.getItem(CONFIG_KEY)!==c){localStorage.setItem(CONFIG_KEY,c);toast('🏷️ Got the office names from the host. They\'ll show next time you open the game.');}}live.players.clear();live.known.clear();
    (m.known||[]).forEach(k=>setKnown(k.id,k.p,k.seat));
    (m.players||[]).forEach(addRemote);
    // this office's server is the source of truth for who your colleagues are
    for(const id of Object.keys(state.friends))if(!live.known.has(id))delete state.friends[id];
    const oldSeat=mySeat;mySeat=typeof m.seat==='number'&&m.seat<CUBES.length?m.seat:-1;checkOverflow();
    rebuildBlocked();
    if(oldSeat!==mySeat||!live.everJoined){const h=homeSpot();player.x=h.x;player.y=h.y;player.path=[];work=null;}
    live.everJoined=true;
    liveSend({t:'move',fx:Math.round(player.x),fy:Math.round(player.y),tx:Math.round(player.x),ty:Math.round(player.y)});
    (m.gifts||[]).forEach(g=>g&&g.romance?onRomance({kind:g.romance,from:g.from,fromId:g.fromId}):receiveGift(g));
    toast('🟢 You\'re in the live office! '+live.players.size+' colleague'+(live.players.size===1?'':'s')+' online.');
    if(mySeat<0)toast('All '+CUBES.length+' cubicles are taken — you\'re hot-desking on the open floor today.');
    curCube=-2;updateLivePill();renderFriends();renderPanel();save();return;
  }
  if(m.t==='removed'){toast('The host removed you from this office. You can rejoin from 🌐 Live.');liveDisconnect(true,true);return;}
  if(!live.on)return;
  const r=live.players.get(m.id);
  switch(m.t){
    case 'join':{const known=live.known.has(m.pl.id);addRemote(m.pl);rebuildBlocked();
      toast((known?'👋 ':'🎉 New colleague: ')+live.players.get(m.pl.id).p.name+(known?' is back in the office':' joined the office'));
      renderFriends();updateLivePill();curCube=-2;save();break;}
    case 'leave':if(r){toast('🚪 '+r.p.name+' left the office');live.players.delete(m.id);rebuildBlocked();renderFriends();updateLivePill();curCube=-2;}break;
    case 'move':if(r){const e=r.e;if(Math.hypot(e.x-m.fx,e.y-m.fy)>1.5){e.x=m.fx;e.y=m.fy;e.path=[];}
      if(!goTo(e,m.tx,m.ty,'remote')){e.x=m.tx;e.y=m.ty;e.path=[];}}break;
    case 'say':if(r)say(r.e,String(m.text).slice(0,80),5);break;
    case 'profile':if(r){const oldName=r.p.name;addRemote({id:m.id,seat:r.seat,p:m.p,x:r.e.x,y:r.e.y});rebuildBlocked();renderFriends();if(curPanel==='gifts'||curPanel==='tasks')renderPanel();curCube=-2;
      if(live.players.get(m.id).p.name!==oldName&&oldName!=='You')toast('✏️ '+oldName+' is now '+live.players.get(m.id).p.name);save();}break;
    case 'gift':receiveGift(m.gift);break;
    case 'dm':onDM(m);break;
    case 'dm-fail':toast('🔒 '+nameOf(m.to)+' went offline. Your message wasn\'t delivered.');break;
    case 'romance':onRomance(m);break;
    case 'romance-fail':toast(nameOf(m.to)+' isn\'t online right now.');break;
    case 'apikey':live.apiKey=String(m.key||'');showKey=true;toast('🔑 New API key ready');renderPanel();break;
    case 'cmd':runCmd(String(m.cmd||''),m.args);break;
    case 'emergency':startEmergency(m.id,m.secs);break;
    case 'emergency-result':if(m.id===emer.id){const me=state.id,made=(m.made||[]).includes(me);finishEmergency({ok:made,all:!!m.all,missed:(m.missed||[]).map(x=>String(x.name||'').slice(0,16))});}break;
    case 'announce':{const txt=String(m.text||'').slice(0,120),from=String(m.from||BOSS).slice(0,16);toast('📣 '+from+': '+txt);if(from.toLowerCase()===BOSS.toLowerCase())say(bossE,txt,8);break;}
    case 'forget':if(partnerKey()===m.id)setPartner(null);delete state.dms[m.id];live.players.delete(m.id);live.known.delete(m.id);delete state.friends[m.id];rebuildBlocked();renderFriends();renderPanel();updateLivePill();curCube=-2;save();break;
    case 'like':toast('👍 '+String(m.from).slice(0,16)+' liked your cubicle!');addXP(2);updateHUD();break;
  }
}
function updateLivePill(){
  $('livePill').classList.toggle('on',live.on);
  $('liveTxt').textContent=live.on?'Live · '+(live.players.size+1)+' online':live.connecting?'Connecting…':live.want?'Reconnecting…':'Offline';
}

// ======================= SOCIAL: secret chat, romance, office politics, API commands =======================
// Relationships are keyed like gift targets: 'n0'..'n5' for computer colleagues, player ids for real people.
function isNpcKey(k){return /^n\d$/.test(String(k));}
function relOf(key){return state.rel[key]||(state.rel[key]={aff:0,trust:0,flirt:'',date:''});}
function nameOf(key){if(isNpcKey(key))return state.team[+key.slice(1)].name;const r=live.players.get(key);if(r)return r.p.name;const f=state.friends[key];return f?f.name:'Someone';}
function npcEnt(key){const n=+String(key).slice(1);return isNpcKey(key)&&!npcHidden(n)?npcs[n]:null;}
function entOf(key){return isNpcKey(key)?npcEnt(key):live.players.has(key)?live.players.get(key).e:null;}
function hearts(e,n){for(let i=0;i<(n||1);i++)setTimeout(()=>floatText(e,'💕','#e64980'),i*260);}
function partnerKey(){return state.partner?state.partner.key:'';}
function affLabel(a){return a>=80?'💖 Smitten':a>=50?'💗 Crush':a>=25?'😊 Friendly':'🙂 Colleague';}
function trustLabel(t){return t>=40?'🤝 Ally':t<=-30?'⚔️ Rival':'';}
function repLabel(r){return r>=60?'🌟 Office legend':r>=25?'👍 Respected':r>-25?'😐 Neutral':r>-60?'👀 Talked about':'🚩 Office villain';}
function allyCount(){return Object.keys(state.rel).filter(k=>state.rel[k].trust>=40).length;}
function xpMult(){return Math.max(.8,1+state.rep/200+Math.min(3,allyCount())*.05);} // reputation and allies speed up promotions
function keyByName(n){n=String(n||'').toLowerCase().trim();if(!n)return null;const t=friendTargets().find(f=>f.key===n||f.name.replace(' · computer','').toLowerCase()===n);return t?t.key:null;}
function openPanelForce(name){if(curPanel===name)renderPanel();else openPanel(name);}
function showChoice(title,html,choices){
  const m=$('choiceModal'),c=$('choiceCard');
  c.innerHTML='<h2 style="margin-top:0">'+title+'</h2><div>'+html+'</div><div class="choices"></div>';
  const w=c.querySelector('.choices');
  choices.forEach(([l,f])=>{const b=document.createElement('button');b.textContent=l;b.onclick=()=>{m.classList.remove('show');f();};w.appendChild(b);});
  m.classList.add('show');
}
function unblockUser(id){state.blocked=state.blocked.filter(x=>x!==id);toast('✅ Unblocked '+nameOf(id)+'.');save();renderPanel();}
function blockUser(id){
  if(!state.blocked.includes(id))state.blocked.push(id);
  if(partnerKey()===id){liveSend({t:'romance',to:id,kind:'breakup'});setPartner(null);}
  toast('🚫 Blocked '+nameOf(id)+'. You won\'t get their messages or romance requests.');save();renderPanel();
}

// ----- secret chat (1-to-1, passed through the server but never stored there) -----
let dmSel=null;
function sendDM(id,text){
  text=String(text||'').trim().slice(0,300);if(!text)return;
  if(!live.on||!live.players.has(id)){toast('🔒 '+nameOf(id)+' is offline. Secret chats only work while you\'re both in the office.');return;}
  if(state.blocked.includes(id)){toast('Unblock '+nameOf(id)+' first.');return;}
  (state.dms[id]=state.dms[id]||[]).push({me:1,text,at:Date.now()});state.dms[id]=state.dms[id].slice(-60);
  liveSend({t:'dm',to:id,text});save();if(curPanel==='dms')renderPanel();
}
function onDM(m){
  const id=String(m.fromId||'');if(!id||state.blocked.includes(id))return;
  (state.dms[id]=state.dms[id]||[]).push({me:0,text:String(m.text||'').slice(0,300),at:Date.now()});state.dms[id]=state.dms[id].slice(-60);
  if(!(curPanel==='dms'&&dmSel===id)){state.unread[id]=(state.unread[id]||0)+1;toast('🔒 Secret message from '+String(m.from||'someone').slice(0,16));}
  updateBadges();save();if(curPanel==='dms')renderPanel();
}
function dmBox(){
  const ids=Object.keys(state.friends).sort((a,b)=>(live.players.has(b)-live.players.has(a))||nameOf(a).localeCompare(nameOf(b)));
  if(!ids.length)return '<div class="box">🔒 Secret chats are private 1-to-1 messages with real colleagues. Join the 🌐 Live office to start one.</div>';
  if(!dmSel||!ids.includes(dmSel))dmSel=ids[0];
  delete state.unread[dmSel];updateBadges();
  const th=(state.dms[dmSel]||[]).map(x=>'<div class="dm'+(x.me?' me':'')+'">'+esc(x.text)+'</div>').join('')||'<div class="muted" style="text-align:center;padding:20px 0">No messages yet. Say hi 👋</div>';
  const on=live.players.has(dmSel),bl=state.blocked.includes(dmSel);
  const chips='<div class="chips">'+ids.map(id=>'<button class="chip'+(id===dmSel?' sel':'')+'" data-dm="'+esc(id)+'">'+(state.blocked.includes(id)?'🚫 ':live.players.has(id)?'🟢 ':'⚪ ')+esc(nameOf(id))+(state.unread[id]?' <b class="ub">'+state.unread[id]+'</b>':'')+'</button>').join('')+'</div>';
  if(bl)return chips+'<div class="box">🚫 You blocked <b>'+esc(nameOf(dmSel))+'</b>. They can\'t send you secret messages or romance requests.<p><button class="primary" id="dmUnblock">Unblock '+esc(nameOf(dmSel))+'</button></p></div>';
  return chips+
    '<div class="thread" id="dmThread">'+th+'</div>'+
    '<div class="row" style="grid-template-columns:1fr auto;display:grid"><input id="dmIn" maxlength="300" placeholder="'+(on?'🔒 Secret message to '+esc(nameOf(dmSel))+'…':esc(nameOf(dmSel))+' is offline')+'" '+(on?'':'disabled')+'><button class="primary" id="dmGo" '+(on?'':'disabled')+'>Send</button></div>'+
    '<div class="muted" style="margin-top:6px">🔒 Only you and '+esc(nameOf(dmSel))+' see these. The server passes them along but never saves them. <a href="#" id="dmBlock">🚫 Block</a> · <a href="#" id="dmClear">🗑️ Clear chat</a></div>';
}
function dmBind(B){
  B.querySelectorAll('[data-dm]').forEach(b=>b.onclick=()=>{dmSel=b.dataset.dm;renderPanel();});
  if($('dmUnblock'))$('dmUnblock').onclick=()=>unblockUser(dmSel);
  const th=$('dmThread');if(th)th.scrollTop=th.scrollHeight;
  const inp=$('dmIn');if(!inp)return;
  const go=()=>{sendDM(dmSel,inp.value);inp.value='';const i2=$('dmIn');if(i2)i2.focus();};
  inp.onkeydown=e=>{e.stopPropagation();if(e.key==='Enter')go();};$('dmGo').onclick=go;
  $('dmBlock').onclick=e=>{e.preventDefault();if(confirm('Block '+nameOf(dmSel)+'?'))blockUser(dmSel);};
  $('dmClear').onclick=e=>{e.preventDefault();delete state.dms[dmSel];save();renderPanel();};
}

// ----- romance -----
const FLIRT_ME=['Nice outfit today 😉','Is it hot in here or is it just you? 🔥','You + me + kopi? ☕','Your PoC was brilliant 😍','Did you just ship to prod? Because you\'re on fire 🔥'];
const FLIRT_LINES={low:['Haha, you\'re funny 😄','Oh! Thanks 😊','Are you… flirting? 😳'],mid:['You always make my day 😊','Stop it, I\'m blushing ☺️','Coffee later? ☕'],high:['I was hoping you\'d come by 💕','You\'re my favourite colleague 😍','😳💕']};
const PARTNER_LINES=['Miss you already 💕','Lunch together later? 🥰','You looked great in the meeting 😍','Thinking of you 💭💕'];
function setPartner(key,name){state.partner=key?{key,name}:null;sendProfile();renderFriends();save();}
function flirt(key){
  const name=nameOf(key);
  if(isNpcKey(key)){
    const r=relOf(key),today=todayKey();
    if(r.flirt===today){toast('You already flirted with '+name+' today. Play it cool 😎');return;}
    r.flirt=today;const g=ri(4,10)+(state.rep>25?2:0);r.aff=Math.min(100,r.aff+g);
    const e=npcEnt(key);say(player,pick(FLIRT_ME),3);
    if(e)setTimeout(()=>{say(e,pick(r.aff>=60?FLIRT_LINES.high:r.aff>=30?FLIRT_LINES.mid:FLIRT_LINES.low),4);hearts(e,2);},900);
    toast('💗 '+name+' +'+g+' affection ('+affLabel(r.aff)+')');save();renderPanel();return;
  }
  if(!live.players.has(key)){toast(name+' isn\'t online right now.');return;}
  liveSend({t:'romance',to:key,kind:'wink'});say(player,'😉',2);toast('😉 You winked at '+name);
}
function coffeeDate(key){
  const r=relOf(key),name=nameOf(key),e=npcEnt(key),today=todayKey();
  if(r.aff<30){toast(name+' doesn\'t know you well enough yet. Flirt a bit first 😉 (needs 💗 30, now '+r.aff+')');return;}
  if(r.date===today){toast('You already had a coffee date with '+name+' today ☕');return;}
  if(!e){toast(name+' isn\'t in the office right now.');return;}
  if(state.player.coins<15){toast('A coffee date costs 15🪙');return;}
  const free=PANTRY_SEATS.filter(s=>s.k==='chair'&&!seatTaken(s,e)&&!seatTaken(s,player));
  let a=null,b=null;for(const s of free){const m=free.find(q=>q.x===s.x&&q.y===s.y+2);if(m){a=s;b=m;break;}}
  if(!a){toast('The Pantry is packed. Try again later!');return;}
  state.player.coins-=15;r.date=today;updateHUD();
  e.dating=true;e.onArrive=null;goTo(e,b.x,b.y,'npc',()=>say(e,'This is nice ☕💕',4));
  setTimeout(()=>{e.dating=false;e.timer=rnd(3,8);},45000);
  pendingTarget=a;work=null;
  walkPlayer(a.x,a.y,()=>{const g=ri(12,18);r.aff=Math.min(100,r.aff+g);state.player.energy=Math.min(100,state.player.energy+20);
    say(player,'☕💕',3);hearts(player,3);hearts(e,3);toast('☕ Coffee date with '+name+'! +'+g+' 💗 affection, +20⚡');
    setTimeout(()=>{e.dating=false;e.timer=rnd(3,8);},10000);updateHUD();save();renderPanel();});
  toast('☕ Heading to the Pantry with '+name+'… (−15🪙)');
}
function askOut(key){
  const name=nameOf(key),pk=partnerKey();
  if(pk===key){toast('You\'re already dating '+name+' 💕');return;}
  if(pk){toast('You\'re dating '+state.partner.name+'. Break up first 💔');return;}
  if(isNpcKey(key)){
    const r=relOf(key);if(r.aff<70){toast(name+' needs to know you better first (💗 70 needed, now '+r.aff+')');return;}
    const e=npcEnt(key);say(player,'Will you go out with me? 🌹',3);
    setTimeout(()=>{
      if(Math.random()*100<r.aff){setPartner(key,name);if(e){say(e,'Yes!! 😍💕',5);hearts(e,4);}hearts(player,4);toast('💕 You and '+name+' are now an office couple!');addXP(10);updateHUD();}
      else{r.aff=Math.max(0,r.aff-10);if(e)say(e,'Aww… let\'s stay colleagues 😅',4);toast('💔 '+name+' said no. Maybe next time.');}
      save();renderPanel();},1200);
    return;
  }
  if(!live.players.has(key)){toast(name+' isn\'t online right now.');return;}
  liveSend({t:'romance',to:key,kind:'ask'});say(player,'🌹',2);toast('🌹 You asked '+name+' out. Waiting for their answer…');
}
function breakUp(){
  const p=state.partner;if(!p||!confirm('Break up with '+p.name+'? 💔'))return;
  if(isNpcKey(p.key)){const r=relOf(p.key);r.aff=Math.max(0,r.aff-30);const e=npcEnt(p.key);if(e)say(e,'…okay 😢',4);}
  else liveSend({t:'romance',to:p.key,kind:'breakup'});
  toast('💔 You and '+p.name+' broke up.');setPartner(null);renderPanel();
}
function onRomance(m){
  const id=String(m.fromId||''),name=String(m.from||'Someone').slice(0,16);
  if(!id||state.blocked.includes(id))return;
  const r=live.players.get(id);
  if(m.kind==='wink'){toast('😉 '+name+' winked at you!');if(r)hearts(r.e,1);}
  else if(m.kind==='ask')showChoice('🌹 '+esc(name)+' asked you out!','Want to be an office couple? Everyone in the office will see 💕 next to your names.',[
    ['💕 Yes!',()=>{const old=state.partner;if(old&&old.key!==id&&!isNpcKey(old.key))liveSend({t:'romance',to:old.key,kind:'breakup'});
      setPartner(id,name);liveSend({t:'romance',to:id,kind:'accept'});toast('💕 You and '+name+' are now an office couple!');hearts(player,4);}],
    ['🙅 No thanks',()=>liveSend({t:'romance',to:id,kind:'decline'})],
    ['🚫 Block '+name,()=>{liveSend({t:'romance',to:id,kind:'decline'});blockUser(id);}]]);
  else if(m.kind==='accept'){setPartner(id,name);toast('💕 '+name+' said yes! You\'re an office couple.');hearts(player,4);addXP(10);updateHUD();}
  else if(m.kind==='decline')toast('💔 '+name+' said no. Plenty of fish in the pantry 🐟');
  else if(m.kind==='breakup'&&partnerKey()===id){setPartner(null);toast('💔 '+name+' broke up with you.');}
  renderPanel();
}
// Couples: mutual partner ids, as each player's profile reports them
function partnerIdOf(id){
  if(id===state.id)return partnerKey()&&!isNpcKey(partnerKey())?partnerKey():'';
  const r=live.players.get(id);if(r)return r.p.partner||'';
  const k=live.known.get(id);return k&&k.p&&k.p.partner||'';
}
function coupled(id){const o=partnerIdOf(id);return !!o&&partnerIdOf(o)===id;}
function isCouple(p){return p.me?!!state.partner:p.kind==='npc'?partnerKey()==='n'+p.n:p.kind==='remote'?(partnerKey()===p.id||coupled(p.id)):false;}
let loveT=2.5;
function loveTick(dt){ // hearts when couples are close, and sweet lines from a computer partner
  loveT-=dt;if(loveT>0)return;loveT=2.5;
  const pe=state.partner&&entOf(state.partner.key);
  if(pe&&Math.hypot(pe.x-player.x,pe.y-player.y)<2.5){floatText(player,'💕','#e64980');}
  else if(pe&&isNpcKey(state.partner.key)&&pe.bubbleT<=0&&Math.random()<.08)say(pe,pick(PARTNER_LINES),4);
  for(const r of live.players.values()){const o=r.p.partner;if(!o||o===state.id||!coupled(r.id))continue;const oe=live.players.get(o);if(oe&&r.id<o&&Math.hypot(oe.e.x-r.e.x,oe.e.y-r.e.y)<2.5)floatText(r.e,'💕','#e64980');}
}

// ======================= 🚨 GPU EMERGENCY =======================
// Every 5 minutes the GPUs shut down. Everyone has 60 seconds to gather in the auditorium for the Great Reboot
// (a group Ctrl… Alt… Delete!). Make it and earn XP; miss it and you're sent back to Intern.
// In the live office the server runs the timer, so everyone gets the alarm at the same moment.
const EMERGENCY_EVERY=300,EMERGENCY_SECS=60;
let emer={phase:'idle',t:EMERGENCY_EVERY,id:0};
const emerZone=()=>ROOMS.auditorium;
function emerSeat(e){const s=emerZone().seats.filter(q=>!seatTaken(q,e));return s.length?pick(s):TASK_SPOTS.auditorium;}
function startEmergency(id,secs){
  if(!state.setup||emer.phase==='gather'||emer.phase==='wait')return;
  emer={phase:'gather',t:secs||EMERGENCY_SECS,id:id||Date.now(),uiT:0};
  toast('🚨 GPU EMERGENCY! Every GPU is shutting down. Get to '+RN.auditorium+' for the Great Reboot!');
  npcs.forEach((n,i)=>{if(npcHidden(i))return;n.dating=false;n.lunching=false;n.emergency=true;n.onArrive=null;const s=emerSeat(n);goTo(n,s.x,s.y,'npc',()=>say(n,pick(['Made it! 😅','Phew 💦','Is it hot in here? 🔥'])));});
  bossE.hold=(secs||EMERGENCY_SECS)+15;goTo(bossE,TASK_SPOTS.auditorium.x,TASK_SPOTS.auditorium.y,'boss',()=>say(bossE,'Everyone here? Reboot on my count! 🖥️',4));

function goToReboot(){const s=emerSeat(player);pendingTarget=s;work=null;if(!walkPlayer(s.x,s.y))toast('Can\'t find a way to '+RN.auditorium+'!');}

function emergencyDeadline(){

  if(live.on&&live.serverEmer){emer.phase='wait';emer.t=8;liveSend({t:'emergency-status',id:emer.id,ok});updateAlert();return;}
  finishEmergency({ok,all:ok,missed:ok?[]:[state.player.name]});
}
function finishEmergency(r){
  if(emer.phase!=='gather'&&emer.phase!=='wait')return;
  emer={phase:'ritual',t:6,id:emer.id};updateAlert();
  const zone=emerZone(),chanters=[...(r.ok?[player]:[]),...npcs.filter((n,i)=>!npcHidden(i)&&inRoom(n,zone)),bossE];
  ['Ctrl… ⌨️','Alt… ⌨️','DELETE! 💥'].forEach((w,k)=>setTimeout(()=>chanters.forEach(e=>say(e,w,1.3)),k*1200));
  setTimeout(()=>{chanters.forEach(e=>floatText(e,'💚','#2f9e44'));

    else demote();
  },3800);
  setTimeout(()=>{npcs.forEach(n=>{if(n.emergency){n.emergency=false;n.timer=rnd(1,5);goTo(n,n.home.x,n.home.y,'npc');}});bossE.hold=2;bossE.timer=0;},6500);

    'You didn\'t make it to <b>'+esc(RN.auditorium)+'</b> in time. You\'re already an Intern, so there\'s nowhere lower to go… this time. 😅',[['😤 Back to work',()=>{}]]);

function emergencyTick(dt){
  if(emer.phase==='idle'){if(!(live.on&&live.serverEmer)&&state.setup){emer.t-=dt;if(emer.t<=0)startEmergency();}return;}
  emer.t-=dt;emer.uiT=(emer.uiT||0)-dt;if(emer.uiT<=0){emer.uiT=.25;updateAlert();}

const cv=$('cv'),ctx=cv.getContext('2d');
const DPR=Math.min(window.devicePixelRatio||1,2),BGS=1.5;
const bg=document.createElement('canvas'),bx=bg.getContext('2d');bg.width=Math.ceil(WW*BGS);bg.height=Math.ceil(WH*BGS);bx.setTransform(BGS,0,0,BGS,0,0);
let VW=800,VH=600;
const cam={x:WW/2,y:WH/2,zoom:1,follow:true};
function fitCanvas(){const st=$('stage');VW=st.clientWidth;VH=st.clientHeight;cv.style.width=VW+'px';cv.style.height=VH+'px';cv.width=Math.round(VW*DPR);cv.height=Math.round(VH*DPR);clampCam();}
window.addEventListener('resize',fitCanvas);
function minZoom(){return Math.max(0.3,Math.min(VW/WW,VH/WH));}
function clampCam(){
  cam.zoom=Math.max(minZoom(),Math.min(2,cam.zoom));
  const hw=VW/2/cam.zoom,hh=VH/2/cam.zoom;
  cam.x=hw*2>=WW?WW/2:Math.max(hw,Math.min(WW-hw,cam.x));
  cam.y=hh*2>=WH?WH/2:Math.max(hh,Math.min(WH-hh,cam.y));
}
function zoomBy(f,sx,sy){
  sx=sx==null?VW/2:sx;sy=sy==null?VH/2:sy;
  const wx=(sx-VW/2)/cam.zoom+cam.x,wy=(sy-VH/2)/cam.zoom+cam.y;
  cam.zoom=Math.max(minZoom(),Math.min(2,cam.zoom*f));
  cam.x=wx-(sx-VW/2)/cam.zoom;cam.y=wy-(sy-VH/2)/cam.zoom;cam.follow=false;clampCam();
}
function camTarget(){const p=iso(player.x+.5,player.y+.5);return {x:p.x,y:p.y-30};}
$('zIn').onclick=()=>zoomBy(1.25);$('zOut').onclick=()=>zoomBy(0.8);
$('zMe').onclick=()=>{cam.follow=true;if(cam.zoom<0.8)cam.zoom=1;};
cv.addEventListener('wheel',ev=>{ev.preventDefault();const r=cv.getBoundingClientRect();zoomBy(Math.exp(-ev.deltaY*0.0015),ev.clientX-r.left,ev.clientY-r.top);},{passive:false});
function evPos(ev){
  const r=cv.getBoundingClientRect(),cx=ev.clientX-r.left,cy=ev.clientY-r.top;
  const sx=(cx-VW/2)/cam.zoom+cam.x,sy=(cy-VH/2)/cam.zoom+cam.y,u=unIso(sx,sy);

let drag=null;
cv.addEventListener('pointerdown',ev=>{drag={x:ev.clientX,y:ev.clientY,cx:cam.x,cy:cam.y,moved:false};});
window.addEventListener('pointermove',ev=>{
  if(drag&&ev.buttons){const dx=ev.clientX-drag.x,dy=ev.clientY-drag.y;
    if(!drag.moved&&Math.hypot(dx,dy)>6){drag.moved=true;cam.follow=false;cv.style.cursor='grabbing';}

function handleClick(ev){
  hidePop();

  if(mySeat>=0)for(const s of deskGiftSpots(mySeat,state.deskGifts))if(Math.hypot(s.x-sx,s.y-sy)<15){consumeFromDesk(s.d.id);return;}

  if(p&&!p.me){
    if(p.kind==='npc'||p.kind==='remote'){if(p.kind==='npc')chatWith(p);
      const card=p.kind==='npc'?{kind:'npc',key:'n'+p.n,name:state.team[p.n].name}:{kind:'remote',key:p.id,online:true,name:p.name};
      const cx=ev.clientX,cy=ev.clientY;setTimeout(()=>showPop({getBoundingClientRect:()=>({left:cx-20,top:cy-12})},card),40);}
    else chatWith(p);
    return;}
  work=null;pendingTarget=null;
  if(x<0||y<0||x>=W||y>=H)return;
  const f=FURN.find(o=>o.use&&x>=o.x&&x<o.x+o.w&&y>=o.y&&y<o.y+o.h);
  if(f&&f.use==='coffee'){pendingTarget=COFFEE_SPOT;walkPlayer(COFFEE_SPOT.x,COFFEE_SPOT.y,useCoffee);return;}
  if(f&&f.use==='fridge'){pendingTarget=FRIDGE_SPOT;walkPlayer(FRIDGE_SPOT.x,FRIDGE_SPOT.y,useFridge);return;}

  const rs=REST_SPOTS.find(s=>s.x===x&&s.y===y);if(rs){restAt(rs);return;}
  if(CORNER_DOOR.some(d=>d.x===x&&d.y===y)&&rankIdx()<4){toast('🔒 '+BOSS+'\'s office is for Directors and above. Knock with a 📋 project update task instead!');return;}

function chatWith(p){

function poly(g,pts,fill){g.beginPath();g.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)g.lineTo(pts[i],pts[i+1]);g.closePath();g.fillStyle=fill;g.fill();}
function diamond(g,x,y,fill,stroke,inset){inset=inset||0;const a=iso(x+inset,y+inset),b=iso(x+1-inset,y+inset),c=iso(x+1-inset,y+1-inset),d=iso(x+inset,y+1-inset);
  g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.lineTo(c.x,c.y);g.lineTo(d.x,d.y);g.closePath();if(fill){g.fillStyle=fill;g.fill();}if(stroke){g.strokeStyle=stroke;g.stroke();}}
// A box standing on tiles. alpha makes the sides see-through (glass cubicle panels).
function box(g,x,y,w,h,z,col,z0,alpha){
  z0=z0||0;const a=iso(x,y),b=iso(x+w,y),c=iso(x+w,y+h),d=iso(x,y+h);
  if(alpha)g.globalAlpha=alpha;
  poly(g,[d.x,d.y-z0,c.x,c.y-z0,c.x,c.y-z,d.x,d.y-z],shade(col,-22));
  poly(g,[c.x,c.y-z0,b.x,b.y-z0,b.x,b.y-z,c.x,c.y-z],shade(col,-42));
  if(alpha)g.globalAlpha=Math.min(1,alpha+.45);
  poly(g,[a.x,a.y-z,b.x,b.y-z,c.x,c.y-z,d.x,d.y-z],col);
  g.globalAlpha=1;
  g.strokeStyle='rgba(0,0,0,.12)';g.beginPath();g.moveTo(a.x,a.y-z);g.lineTo(b.x,b.y-z);g.lineTo(c.x,c.y-z);g.lineTo(d.x,d.y-z);g.closePath();g.stroke();
}
function faceL(g,x0,x1,y,z0,z1,col){const a=iso(x0,y),b=iso(x1,y);poly(g,[a.x,a.y-z0,b.x,b.y-z0,b.x,b.y-z1,a.x,a.y-z1],col);}
function faceR(g,x,y0,y1,z0,z1,col){const a=iso(x,y0),b=iso(x,y1);poly(g,[a.x,a.y-z0,b.x,b.y-z0,b.x,b.y-z1,a.x,a.y-z1],col);}

function updateNPC(n,dt){
  if(npcHidden(n.idx)){n.hidden=true;return;}
  if(n.hidden){n.hidden=false;n.x=n.home.x;n.y=n.home.y;n.path=[];n.meeting=false;n.lunching=false;}
  moveEnt(n,dt);if(n.bubbleT>0)n.bubbleT-=dt;
  if(n.meeting||n.dating||n.emergency)return;
  // lunch: head to the pantry and stay until 2pm
  if(isLunch()&&!n.lunching){const free=PANTRY_SEATS.filter(s=>!seatTaken(s,n));if(free.length){const s=pick(free);n.lunching=true;n.onArrive=null;goTo(n,s.x,s.y,'npc',()=>say(n,pick(LUNCH_LINES)));return;}}
  if(n.lunching){if(isLunch()){if(!n.path.length&&Math.random()<dt*.04)say(n,pick(LUNCH_LINES));return;}n.lunching=false;goTo(n,n.home.x,n.home.y,'npc');n.timer=rnd(5,15);return;}
  if(n.path.length)return;
  n.timer-=dt;if(n.timer>0)return;
  const atHome=Math.round(n.x)===n.home.x&&Math.round(n.y)===n.home.y;
  if(atHome){
    const roll=Math.random();let dest;
    if(barShown()&&roll<0.15){const s=pick(BAR_STOOLS);dest={x:s.x,y:s.y,say:pick(['Cheers! 🍻','One beer please 🍺','Wine, please 🍷','Cocktail time 🍸'])};}
    else if(barShown()&&roll<0.23){dest=Object.assign(danceTile(),{say:pick(['💃 Let\'s dance!','🕺 Tune!','🎶 Love this song','DJ '+DJ+'! 🙌'])});}
    else if(roll<0.3){const s=pick(REST_SPOTS);dest={x:s.x,y:s.y,say:s.k==='nap'?'Zzz… 💤':'Ahh, relaxing 😌'};}
    else dest=roll<0.45?CUBES[ri(1,6)].entry:pick(ROAM);
    if(goTo(n,dest.x,dest.y,'npc',()=>{if(dest.say)say(n,dest.say);else if(Math.random()<.35)say(n,officeLine());}))n.timer=rnd(4,9);else n.timer=2;
  }else{goTo(n,n.home.x,n.home.y,'npc');n.timer=rnd(8,20);}
}

  const ci=c?c.i:inClub(player)&&barShown()?-6:inBar(player)&&barShown()?-3:rm&&rm.id==='recharge'?-4:rm&&rm.id==='pantry'?-5:-1;
  if(ci!==curCube){curCube=ci;updateBanner();}
  if(cam.follow&&!drag){const tg=camTarget(),f=Math.min(1,dt*5);cam.x+=(tg.x-cam.x)*f;cam.y+=(tg.y-cam.y)*f;clampCam();}
  uiT+=dt;if(uiT>0.25){uiT=0;updateHUD();updateMeetStatus();}
  saveT+=dt;if(saveT>5){saveT=0;save();}
  floats.forEach(f=>f.t+=dt);while(floats.length&&floats[0].t>1.8)floats.shift();
  render(now);
  requestAnimationFrame(tick);
}

// ======================= INIT =======================
function decorateNPCs(){
  const pool=Object.keys(ITEMS).filter(k=>ITEMS[k].r<=2);
  for(let i=1;i<=6;i++){
    const cd=state.npcCubes[i];cd.items=[];cd.desk=pick(DESKS);cd.wall=pick(WALLS);
    const spots=[...PLACE].sort(()=>Math.random()-.5),n=ri(4,8);
    for(let k=0;k<n;k++){const t=pick(pool),it={t,dx:spots[k].dx,dy:spots[k].dy};if(t==='rug')it.col=pick(RUGS);cd.items.push(it);if(!cubeOK(cd,CUBES[i]))cd.items.pop();}
  }
  state.npcDecorated=true;
}
state=load();
if(!state)state=newState();
if(!state.npcDecorated)decorateNPCs();
rebuildBlocked();spawnPeople();fitCanvas();
{const t=camTarget();cam.x=t.x;cam.y=t.y;clampCam();}
updateHUD();updateBadges();renderFriends();updateLivePill();
if(!state.setup)openSetup();
window.addEventListener('beforeunload',save);
if(/^https?:$/.test(location.protocol)&&location.port)liveConnect(location.host,true);
else if(window.officeHost&&state.hosting)startHosting();
else if(state.autoJoin&&state.server)liveConnect(state.server,true);
$('brandCo').textContent=CFG.company?CFG.company+' ':'';document.title=(CFG.company?CFG.company+' ':'')+'Innovation Office';
requestAnimationFrame(tick);
</script>
